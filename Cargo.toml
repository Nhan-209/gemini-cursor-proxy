[package]
name = "gemini-openai-gateway"
version = "0.1.0"
edition = "2021"
authors = ["Senior Rust & Cloudflare Workers Engineer"]
description = "Universal OpenAI-compatible API Gateway for Google Gemini on Cloudflare Workers (Cursor, Cline, Roo Code, Continue, Aider, OpenAI SDK)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
async-trait = "0.1"
futures-util = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
