name = "gemini-openai-gateway"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "worker-build --release"

[vars]
PRIMARY_MODEL = "gemini-2.5-flash"
THINKING_LEVEL = "high"
FORCE_MODEL = "false"
SMART_ROUTER_ENABLED = "true"
BASE_PATH = "/v1"
CONFIG_VERSION = "2"
PROXY_TOKEN = "sk-proxy-pcn-secret-inf"

# Sensitive secrets must be configured via Cloudflare Dashboard or `wrangler secret put`:
# - PROXY_TOKEN
# - GEMINI_KEY_01
# - GEMINI_KEY_02
# - GEMINI_KEY_03
# - GEMINI_KEY_04
# - GEMINI_KEY_05
